services:

  database:
    image: 
      pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ko-networks

  # api:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: cognita-api
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://cache:6379
    volumes:
      - upload_data:/data/uploads
    networks:
      - ko-networks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # orchestrator:
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: cognita-orchestrator
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy 
    ports:
     - "8000:8000"
    env_file:
      - .env
    environment:
      API_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable 
      REDIS_URL: redis://cache:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload_data:/data/uploads
    networks:
      - ko-networks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # worker:
  worker:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: cognita-worker
    command: ["python", "-m", "app.worker"]
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://cache:6379
      OLLAMA_URL: http://ollama:11434
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload_data:/data/uploads
    networks:
      - ko-networks
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ko-networks
    restart: unless-stopped
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ko-networks
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  ollama_data:
  upload_data:

networks:
  ko-networks:
    driver: bridge